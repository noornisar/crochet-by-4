<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Contact Inquiry - {{ store_name }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #FFF7FA; margin: 0; padding: 20px; color: #333; }
        .card { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 16px; border: 1px solid rgba(209, 91, 128, 0.15); overflow: hidden; box-shadow: 0 4px 15px rgba(209, 91, 128, 0.08); }
        .head { background: #D15B80; color: #fff; padding: 22px 25px; }
        .head h2 { margin: 0; font-size: 20px; font-family: 'Poppins', sans-serif; }
        .body { padding: 25px; line-height: 1.6; }
        .field { margin-bottom: 14px; }
        .field strong { color: #D15B80; display: inline-block; width: 100px; }
        .msg-box { background: #FFF8FB; border: 1px solid rgba(209, 91, 128, 0.2); border-radius: 10px; padding: 16px; margin-top: 14px; white-space: pre-line; }
        .reply-btn { display: inline-block; background: #D15B80; color: #fff !important; text-decoration: none; padding: 10px 22px; border-radius: 20px; font-weight: 600; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="head">
            <h2>🌸 New Customer Inquiry</h2>
        </div>
        <div class="body">
            <p>You have received a new inquiry through the <strong>{{ store_name }}</strong> website contact form:</p>
            <div class="field"><strong>Name:</strong> {{ name }}</div>
            <div class="field"><strong>Email:</strong> <a href="mailto:{{ email }}">{{ email }}</a></div>
            <div class="field"><strong>Subject:</strong> {{ subject }}</div>
            <div class="field"><strong>Message:</strong></div>
            <div class="msg-box">{{ message }}</div>
            <p style="margin-top: 22px;">
                <a href="mailto:{{ email }}?subject=Re: {{ subject }}" class="reply-btn">Reply to Customer</a>
            </p>
        </div>
    </div>
</body>
</html>
