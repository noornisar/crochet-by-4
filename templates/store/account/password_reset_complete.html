{% extends "store/base.html" %}
{% load static %}

{% block title %}
Password Changed - Crochet Store
{% endblock %}

{% block content %}

<style>
.auth-section {
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
    background: #FFF7FA;
    font-family: var(--font-ui);
}

.auth-card {
    width: 100%;
    max-width: 460px;
    background: white;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(209, 91, 128, 0.08);
    border: 1px solid rgba(209, 91, 128, 0.15);
    text-align: center;
    font-family: var(--font-ui);
}

.icon-wrapper {
    width: 70px;
    height: 70px;
    background: #e6f9ed;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: #28a745;
    font-size: 32px;
}

.auth-card h1 {
    color: #D15B80;
    margin-bottom: 14px;
    font-size: 24px;
    font-weight: 700;
    font-family: var(--font-branding) !important;
}

.auth-card p {
    color: #555;
    font-size: 14.5px;
    line-height: 1.65;
    margin-bottom: 28px;
    font-family: var(--font-ui);
}

.btn-primary {
    display: inline-block;
    padding: 13px 32px;
    background: #D15B80;
    color: white !important;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    font-family: var(--font-ui);
    box-shadow: 0 4px 15px rgba(209, 91, 128, 0.25);
    transition: all .25s ease;
}

.btn-primary:hover {
    background: #B84368;
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(209, 91, 128, 0.35);
}
</style>

<div class="auth-section">
    <div class="auth-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h1>🌸 Password Changed!</h1>
        <p>Your password has been successfully reset. You can now log in using your new credentials.</p>

        <a href="{% url 'account:login' %}" class="btn-primary">
            Login Now 🌸
        </a>
    </div>
</div>

{% endblock %}
