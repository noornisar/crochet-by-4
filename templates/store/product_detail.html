{% extends "./base.html" %}

{% block title %}
{{ product.title }}
{% endblock %}

{% block content %}
<style>
.product-page{

    width:90%;
    margin:60px auto;
    display:flex;
    gap:60px;
    align-items:flex-start;

}

.product-gallery{

    width:500px;

}

.main-slider{

    position:relative;
    width:500px;
    height:500px;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.detail-slide{

    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity .6s ease;

}

.detail-slide.active{

    opacity:1;

}

.thumbnail-container{

    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:20px;
    flex-wrap:wrap;

}

.thumbnail{

    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    border:3px solid #ffd6e7;
    transition:.3s;

}

.thumbnail:hover{

    border-color:#ff4f88;
    transform:scale(1.08);

}

.product-info{

    flex:1;

}

.product-info h1{

    font-size:48px;

}

.product-info h2{

    color:#ff4f88;
    margin:20px 0;

}

.buy-btn {
    margin-top: 20px;
    background: #ff4f88;
    color: white;
    border: none;
    padding: 15px 40px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    transition: 0.3s ease;
    box-shadow: 0 6px 15px rgba(255, 79, 136, 0.25);
}

.buy-btn:hover {
    background: #ff2f72;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(255, 79, 136, 0.35);
}

.buy-btn:active {
    transform: scale(0.98);
}

/* =========================
   QUANTITY SELECTOR
========================= */

.product-quantity {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 25px;
}

/* Plus & Minus Buttons */

.product-quantity button {
    width: 53px;
    height: 53px;

    border: none;
    border-radius: 12px;

    background: #ffd6e7;
    color: #111;

    font-size: 26px;
    font-weight: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: all 0.2s ease;
}

.product-quantity button:hover {
    background: #ffb8d3;
    transform: translateY(-2px);
}

.product-quantity button:active {
    transform: scale(0.95);
}


/* Quantity Input */

.product-quantity input {
    width: 90px;
    height: 53px;

    border: 1px solid #d8d8d8;
    border-radius: 12px;

    background: #fff;

    text-align: center;

    font-size: 20px;
    font-weight: 500;

    color: #222;

    outline: none;

    padding: 0;
    margin: 0;
}

.product-quantity input:focus {
    border-color: #ff4f88;
    box-shadow: 0 0 0 2px rgba(255, 79, 136, 0.10);
}


/* Remove number arrows */

.product-quantity input::-webkit-inner-spin-button,
.product-quantity input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.product-quantity input {
    -moz-appearance: textfield;
}

/* =========================
   ADD TO CART BUTTON
========================= */

.buy-btn {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-top: 20px;

    width: 260px;
    height: 58px;

    background: #f36793;
    color: white;

    border: none;
    border-radius: 14px;

    font-size: 19px;
    font-weight: 600;

    cursor: pointer;

    transition: all 0.3s ease;

    box-shadow: 0 7px 18px rgba(255, 79, 136, 0.25);
}

.buy-btn:hover {

    background: #eb779c;

    transform: translateY(-2px);

    box-shadow: 0 10px 22px rgba(255, 79, 136, 0.30);
}

.buy-btn:active {

    transform: scale(0.98);

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .product-quantity {
        width: 280px;
    }

    .buy-btn {
        width: 280px;
    }

}

</style>
<div class="product-page">

    <div class="product-gallery">

        <div class="main-slider">

            {% for image in product.images.all %}

                <img
                    src="{{ image.image.url }}"
                    class="detail-slide {% if forloop.first %}active{% endif %}">

            {% endfor %}

        </div>

        <div class="thumbnail-container">

            {% for image in product.images.all %}

                <img
                    src="{{ image.image.url }}"
                    class="thumbnail">

            {% endfor %}

        </div>

    </div>


    <div class="product-info">

        <h1>{{ product.title }}</h1>

        <h2>Rs {{ product.price }}</h2>

        <p>{{ product.description }}</p>

       

        <div class="product-quantity">

    <button type="button" id="minus">
        −
    </button>

    <input
        id="select"
        type="number"
        value="1"
        min="1">

    <button type="button" id="plus">
        +
    </button>

</div>

        
    <div>  
       <button
    id="add-button"
    value="{{ product.id }}"
    class="buy-btn">
    Add to Cart
</button>
    </div>  

    </div>

</div>

<script>
    // Automatic Slider

const slides=document.querySelectorAll(".detail-slide");

let current=0;

if(slides.length>1){

setInterval(function(){

slides[current].classList.remove("active");

current++;

if(current>=slides.length){

current=0;

}

slides[current].classList.add("active");

},3000);

}


// Thumbnail Click

document.querySelectorAll(".thumbnail").forEach(function(thumb,index){

thumb.addEventListener("click",function(){

slides.forEach(function(img){

img.classList.remove("active");

});

slides[index].classList.add("active");

current=index;

});

});


// Quantity

$("#plus").click(function () {

    let qty = parseInt($("#select").val()) || 1;

    $("#select").val(qty + 1);

});


$("#minus").click(function () {

    let qty = parseInt($("#select").val()) || 1;

    if (qty > 1) {
        $("#select").val(qty - 1);
    }

});

// Add To Cart

$(document).on("click","#add-button",function(e){

e.preventDefault();

$.ajax({

type:"POST",

url:"{% url 'basket:basket_add' %}",

data:{

productid:$("#add-button").val(),

productqty:$("#select").val(),

csrfmiddlewaretoken:"{{ csrf_token }}",

action:"post"

},

success:function(json){

$("#basket-qty").text(json.qty);

$("#cart-sidebar").addClass("active");

$("#cart-items").html(`

<div class="cart-item">

<img src="${json.image}">

<div class="item-details">

<h4>${json.product}</h4>

<p>Rs ${json.price}</p>

<small>Quantity : ${json.productqty}</small>

</div>

</div>

`);

},

error:function(xhr){

console.log(xhr.responseText);

}

});

});


// Close Cart

$("#close-cart").click(function(){

$("#cart-sidebar").removeClass("active");

});

</script>

{% endblock %}
